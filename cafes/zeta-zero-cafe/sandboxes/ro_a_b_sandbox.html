<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>RO A/B Sandbox — one memo, three lenses</title>

<style>
  :root { color-scheme: dark; }
  body { margin:0; font:14px/1.55 system-ui,-apple-system, Segoe UI, Roboto, Inter, Arial, sans-serif; background:#0B1117; color:#E6EDF3; }
  header { padding:10px 14px; border-bottom:1px solid #1f2a36; background:#0F141A; display:flex; flex-wrap:wrap; gap:10px; align-items:center; }
  header .title { font-weight:600; margin-right:auto; }
  .bar { display:flex; flex-wrap:wrap; gap:6px; align-items:center; }
  .btn { all:unset; cursor:pointer; padding:6px 10px; border:1px solid #273341; border-radius:8px; background:#111a24; }
  .btn:hover { background:#162234; }
  .btn.primary { border-color:#2f6feb; }
  .btn.warn { border-color:#d29922; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size:12px; }

  main { display:grid; grid-template-columns: 48% 52%; gap:12px; padding:12px; }
  .card { background:#0F141A; border:1px solid #1f2a36; border-radius:10px; overflow:hidden; display:flex; flex-direction:column; min-height:0; }
  .card .head { padding:10px 12px; border-bottom:1px solid #1f2a36; font-weight:600; display:flex; align-items:center; gap:8px; }
  .card .head .right { margin-left:auto; display:flex; gap:6px; }
  .card .body { padding:10px 12px; overflow:auto; min-height:0; }
  textarea { width:100%; min-height:220px; resize:vertical; border-radius:8px; border:1px solid #273341; background:#0B1117; color:#E6EDF3; padding:10px; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }

  .preview { max-width:980px; margin:0 auto; }
  .preview h1 { font-size:26px; margin:.8rem 0 .4rem; }
  .preview h2 { font-size:22px; margin:.8rem 0 .3rem; }
  .preview h3 { font-size:18px; margin:.8rem 0 .2rem; }
  .preview p { margin:.5rem 0; }
  .preview table { width:100%; border-collapse:collapse; margin:.6rem 0; }
  .preview th, .preview td { border:1px solid #273341; padding:6px 8px; vertical-align:top; }
  pre { background:#0F141A; border:1px solid #1f2a36; padding:12px; border-radius:8px; overflow:auto; }

  .hint { color:#9fbad1; opacity:.9; }
  .tag { border:1px solid #273341; border-radius:999px; padding:2px 6px; font-size:11px; }
</style>

<!-- MathJax (full bundle) -->
<script>
  window.MathJax = {
    tex: { tags:'ams', inlineMath: [['\\(','\\)'], ['\\[\\[','\\]\\]']] },
    options: { skipHtmlTags: ['script','noscript','style','textarea','pre','code'] }
  };
</script>
<script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml-full.js"></script>

<!-- marked.js -->
<script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
</head>
<body>

<header>
  <div class="title">A/B sandbox — one memo, different lenses</div>
  <div class="bar">
    <button class="btn" id="promote">Promote (a → b)</button>
    <button class="btn" id="demote">Demote (b → a)</button>
    <button class="btn" id="genSelf">Generate self from order</button>
  </div>
  <div class="bar">
    <button class="btn" id="expA">Export {a}</button>
    <button class="btn" id="expB">Export {b}</button>
    <button class="btn" id="expAB">Export {a+b}</button>
    <button class="btn primary" id="expFormal">Export {formal}</button>
  </div>
  <div class="bar mono" id="status"></div>
</header>

<main>
  <section class="card">
    <div class="head">Memo to self <span class="tag">a</span><span class="hint mono">— train of thought (top)</span><div class="right"><span class="mono" id="aCount"></span></div></div>
    <div class="body"><textarea id="taA" spellcheck="false" placeholder="Your stream… use [contemplate] where you want to come back."></textarea></div>
    <div class="head">Live Preview (a+b)</div>
    <div class="body"><div id="preview" class="preview"></div></div>
  </section>

  <section class="card">
    <div class="head">Memo to order <span class="tag">b</span><span class="hint mono">— ordered file of thought (bottom)</span><div class="right"><span class="mono" id="bCount"></span></div></div>
    <div class="body"><textarea id="taB" spellcheck="false" placeholder="Your ordered argument… include [yet to be delivered] for known gaps."></textarea></div>
    <div class="head">Whole memo (read-only)</div>
    <div class="body">
      <pre id="fullText" class="mono" style="white-space:pre-wrap;"></pre>
    </div>
  </section>
</main>

<script>
/* ---------- utilities ---------- */
const $ = (s, el=document)=>el.querySelector(s);
const status = (t)=> $('#status').textContent = t;

async function typeset(el){
  if (!window.MathJax || !el) return;
  try {
    if (MathJax.startup?.promise) await MathJax.startup.promise;
    MathJax.typesetClear?.([el]); MathJax.texReset?.();
    if (MathJax.typesetPromise) await MathJax.typesetPromise([el]);
    else MathJax.typeset?.([el]);
  } catch {}
}

function dl(name, text){
  const a=document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text],{type:'text/plain'}));
  a.download = name; a.click(); URL.revokeObjectURL(a.href);
}

/* ---------- single memo storage with A/B markers ---------- */
const A_START = '<!-- SECTION a:start -->';
const A_END   = '<!-- SECTION a:end -->';
const B_START = '<!-- SECTION b:start -->';
const B_END   = '<!-- SECTION b:end -->';

function buildWhole(a, b){
  return [
    A_START, '\n', a.trim(), '\n', A_END, '\n\n',
    B_START, '\n', b.trim(), '\n', B_END, '\n'
  ].join('');
}

function splitWhole(whole){
  const get = (start, end) => {
    const i = whole.indexOf(start), j = whole.indexOf(end);
    if (i === -1 || j === -1 || j < i) return '';
    return whole.slice(i + start.length, j).replace(/^\n/, '').replace(/\n$/, '');
  };
  return { a: get(A_START, A_END), b: get(B_START, B_END) };
}

const LSKEY = 'ro:ab:memo:' + location.pathname;

/* ---------- state & boot ---------- */
let WHOLE = '';

function seedIfEmpty(){
  const exampleA = `# scratchpad\n[contemplate] how chord density relates to triangular numbers\n\nnotes:\n- map page refs: [mm|p54=60,129:104,169]\n- analogy: ladder leaning ⇒ √n/(n+1)?`;
  const exampleB = `## ordered argument\n1) observation → numeric pattern suggests roots of fractions\n2) hypothesis → \\( r_q = \\sqrt{\\frac{n}{n+1}} \\)\n3) evidence → see Fig. 5.3 crop\n\n[yet to be delivered] small derivation from geometry\n`;
  WHOLE = buildWhole(exampleA, exampleB);
}

function loadWhole(){
  const raw = localStorage.getItem(LSKEY);
  if (raw && raw.includes(A_START) && raw.includes(B_START)) {
    WHOLE = raw;
  } else { seedIfEmpty(); }
}

function saveWhole(){
  localStorage.setItem(LSKEY, WHOLE);
  status('saved · ' + new Date().toLocaleTimeString());
}

function refreshEditors(){
  const {a,b} = splitWhole(WHOLE);
  $('#taA').value = a;
  $('#taB').value = b;
  $('#aCount').textContent = a.trim().split(/\s+/).filter(Boolean).length + ' words';
  $('#bCount').textContent = b.trim().split(/\s+/).filter(Boolean).length + ' words';
  $('#fullText').textContent = WHOLE;
  renderPreview(a,b);
}

function renderPreview(a,b){
  const html = marked.parse([a, '\n\n---\n\n', b].join(''));
  const out = $('#preview');
  out.innerHTML = html;
  typeset(out);
}

function syncFromEditors(){
  const a = $('#taA').value, b = $('#taB').value;
  WHOLE = buildWhole(a, b);
  saveWhole(); refreshEditors();
}

/* ---------- promote/demote ---------- */
function getSel(el){ return { s: el.selectionStart||0, e: el.selectionEnd||0 }; }

function promote(){ // a -> b
  const taA = $('#taA'), taB = $('#taB');
  const {s,e} = getSel(taA);
  if (e <= s) return alert('Select some text in {a} to promote.');
  const pick = taA.value.slice(s,e).trim();
  const aNew = (taA.value.slice(0,s) + taA.value.slice(e)).replace(/\n{3,}/g,'\n\n');
  const bNew = (taB.value + '\n\n' + pick).replace(/\n{3,}/g,'\n\n');
  WHOLE = buildWhole(aNew, bNew);
  saveWhole(); refreshEditors();
}

function demote(){ // b -> a
  const taA = $('#taA'), taB = $('#taB');
  const {s,e} = getSel(taB);
  if (e <= s) return alert('Select some text in {b} to demote.');
  const pick = taB.value.slice(s,e).trim();
  const bNew = (taB.value.slice(0,s) + taB.value.slice(e)).replace(/\n{3,}/g,'\n\n');
  const aNew = (taA.value + '\n\n' + pick).replace(/\n{3,}/g,'\n\n');
  WHOLE = buildWhole(aNew, bNew);
  saveWhole(); refreshEditors();
}

/* ---------- generate self from order ---------- */
/* turns headings in {b} into reflection prompts appended to {a} */
function genSelfFromOrder(){
  const {a,b} = splitWhole(WHOLE);
  const lines = b.split(/\r?\n/);
  const prompts = [];
  for (const ln of lines){
    const m = ln.match(/^(#{1,3})\s+(.*)$/);
    if (m){
      const lvl = m[1].length, txt = m[2].trim();
      prompts.push(`${' '.repeat((lvl-1)*2)}- [contemplate] ${txt}`);
    }
  }
  if (!prompts.length) { alert('No headings found in {b}; add #, ##, or ### to seed prompts.'); return; }
  const injected = (a + '\n\n' + prompts.join('\n')).replace(/\n{3,}/g,'\n\n');
  WHOLE = buildWhole(injected, b);
  saveWhole(); refreshEditors();
}

/* ---------- exports ---------- */
function exportA(){ dl('memo_a.txt', splitWhole(WHOLE).a); }
function exportB(){ dl('memo_b.txt', splitWhole(WHOLE).b); }
function exportAB(){ dl('memo_ab.txt', splitWhole(WHOLE).a + '\n\n' + splitWhole(WHOLE).b); }
/* formal: for now it’s simply {b} as-is (scientific minimum) — placeholders remain visible */
function exportFormal(){
  const b = splitWhole(WHOLE).b;
  dl('memo_formal.txt', b);
}

/* ---------- events & boot ---------- */
loadWhole(); refreshEditors();
$('#taA').addEventListener('input', ()=>{ WHOLE = buildWhole($('#taA').value, $('#taB').value); saveWhole(); renderPreview($('#taA').value,$('#taB').value); $('#fullText').textContent=WHOLE; });
$('#taB').addEventListener('input', ()=>{ WHOLE = buildWhole($('#taA').value, $('#taB').value); saveWhole(); renderPreview($('#taA').value,$('#taB').value); $('#fullText').textContent=WHOLE; });

$('#promote').addEventListener('click', promote);
$('#demote').addEventListener('click', demote);
$('#genSelf').addEventListener('click', genSelfFromOrder);

$('#expA').addEventListener('click', exportA);
$('#expB').addEventListener('click', exportB);
$('#expAB').addEventListener('click', exportAB);
$('#expFormal').addEventListener('click', exportFormal);

status('ready · autosave active');
</script>
</body>
</html>
