<!-- ---------- Theme ---------- -->
<style>
:root { color-scheme: dark; }
html,body{margin:0;padding:0;background:#0f141a;color:#deedf7;font:14px/1.55 system-ui, -apple-system, Segoe UI, Roboto, Inter, Arial, sans-serif}
a{color:#8ecbff;text-decoration:none}
a:hover{text-decoration:underline}
.mono{font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace}
button{cursor:pointer}
.btn{border:1px solid #273341;background:#0b1219;color:#deedf7;border-radius:8px;padding:6px 10px}
.btn:hover{background:#101a24}
.btn.primary{background:#0e5da7;border-color:#0e5da7}
.btn.primary:hover{background:#0c5498}
.btn.danger{background:#3b0f14;border-color:#5e1a22}
.btn.icon{padding:4px 8px}
.pill{border:1px solid #334355;border-radius:999px;padding:2px 8px}
.badge{border:1px solid #334355;border-radius:6px;padding:2px 6px;font-size:12px;opacity:.9}
.muted{opacity:.75}

.wrap{max-width:1280px;margin:0 auto;padding:12px}
.head{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-bottom:8px}
.head .sp{flex:1 1 auto}

.grid{display:grid;grid-template-columns:48% 52%;gap:12px}
.card{background:#0b1219;border:1px solid #273341;border-radius:10px;overflow:hidden}
.card .head{border-bottom:1px solid #1f2a36;padding:10px 12px;margin:0}
.card .body{padding:12px}
#list .snip{border:1px solid #273341;border-radius:10px;margin:10px 10px 0 10px;overflow:hidden}
#list .snip.active{outline:2px solid #1fa2d6}
#list .bar{display:flex;align-items:center;gap:10px;padding:8px 10px;background:#0b1219;border-bottom:1px solid #1f2a36}
#list .bar .left{display:flex;align-items:center;gap:6px}
#list .bar .tools{margin-left:auto;display:flex;gap:6px;align-items:center}
#list .title{font-weight:600}
#list .body{padding:10px}
/* collapsed by default */
#list .snip.collapsed .body{display:none}

/* “hover to open” */
#list .snip.collapsed:hover .body{display:block}
#list .snip.collapsed:hover .bar{background:#121b25}
.snip .type.badge{min-width:92px;text-align:center}

.preview .pv-snip{border:1px solid #273341;border-radius:10px;margin:10px;overflow:hidden}
.preview .pv-head{display:none !important;}  /* hide type/title in preview */
.preview .pv-body{padding:12px}
.preview table{border-collapse:collapse}
.preview th,.preview td{border:1px solid #273341;padding:6px 8px}

.drag-hint{opacity:.5}

/* ---------- Modal ---------- */
.editor-modal::backdrop{background:rgba(0,0,0,.55)}
.editor-modal{border:1px solid #273341;border-radius:10px;padding:0;width:min(980px,92vw)}
.modal-shell{display:flex;flex-direction:column;gap:10px;padding:12px}
.modal-head{display:flex;align-items:center;gap:8px}
.modal-head .muted{opacity:.7;font-size:.9em}
.modal-head .btn.icon{margin-left:auto}
.lbl{display:flex;flex-direction:column;gap:6px}
.input{border:1px solid #273341;background:#0b1219;color:#deedf7;border-radius:8px;padding:8px}
.editor{min-height:240px;border:1px solid #273341;background:#0b1219;color:#deedf7;border-radius:8px;padding:10px;font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace}
.toolbar{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 8px}
.modal-foot{display:flex;align-items:center;gap:8px}
.split-warn{color:#ffcc88}
/* Live Preview blocks */
.preview .pv-snip{
  border:1px solid #273341;
  border-radius:10px;
  margin:10px;
  overflow:hidden;
}

/* Match the left-column active highlight */
.preview .pv-snip.active{
  outline:2px solid #1fa2d6;       /* blue ring like the left cards */
  border-color:#1fa2d6;
}
/* Dock header snippet styling */
.snip.dock .bar {
  background: #0c1520;
  border-left: 6px solid #788197; /* neutral */
}
.snip.dock .title {
  font-weight: 700;
  letter-spacing: .2px;
}

/* When a group is collapsed, hide its members (in list & preview) */
.snip.group-member.hidden { display: none !important; }
.preview .pv-snip.group-member.hidden { display: none !important; }

/* Dock controls */
.snip.dock .tools .dock-toggle {
  border-color: #3a4556;
}
.snip.dock.collapsed .tools .dock-toggle::after {
  content: ' (collapsed)';
  opacity: .7;
  font-size: 12px;
  margin-left: 6px;
}

  /* … existing styles … */
  #list .snip .bar{ cursor: grab; }
  #list .snip.drag-hint{ opacity:.6 }
</style>

<body>
<div class="wrap">

  <div class="head">

<!-- ---------- Edit dialog (hidden on load) ---------- -->
<dialog id="modal" class="editor-modal">
  <form method="dialog" class="modal-shell" id="modalForm">
    <header class="modal-head">
      <strong>Edit</strong>
      <span id="mType" class="muted"></span>
      <button type="button" class="btn icon" id="btnClose" aria-label="Close">✕</button>
    </header>

    <label class="lbl">Title
      <input id="FT" class="input" placeholder="Short label / claim" />
    </label>

    <div id="modal-toolbar" class="toolbar">
      <button type="button" class="btn" data-insert="header">🪪 Header info</button>
      <button type="button" class="btn" data-insert="discord">💬 Discord stats</button>
      <button type="button" class="btn" data-insert="logic">🧩 Logic skeleton</button>
      <button type="button" class="btn" data-insert="inline">∗ Inline math</button>
      <button type="button" class="btn" data-insert="block">∎ Block math</button>
      <button type="button" class="btn" data-insert="figure">🖼️ Image/Table</button>
    </div>

    <label class="lbl">Body
      <textarea id="FB" class="editor" spellcheck="false"
        placeholder="Markdown + LaTeX. Use \\( ... \\) or \\[ ... \\]. Type [split] to split."></textarea>
    </label>

    <div class="modal-foot">
      <span id="splitInfo" class="pill">[split] markers: 0</span>
      <span class="muted" id="splitTip"></span>

      <button type="button" class="btn primary" id="btnSave">Save</button>
    </div>
  </form>
</dialog>

<script>
/* =========================
   Small state + utilities
   ========================= */
const $ = (q,root=document)=>root.querySelector(q);
const $$= (q,root=document)=>Array.from(root.querySelectorAll(q));
const storageKey = 'ro_snips_v2';
const groupKey = storageKey + ':groups';
let GROUPS = {}; // { dockId: { collapsed: boolean } }

const id = ()=>'s'+Math.random().toString(36).slice(2,9);

let SNIPS = [];              // {id,type,title,body}
let ACTIVE_ID = null;        // selected card
let EDITING   = null;        // current snippet in modal

const TYPES = ['Observation','Hypothesis','Evidence','Dock'];
const typeColor = t =>
  t==='Observation' ? '#2e8369' :
  t==='Hypothesis'  ? '#3683c8' :
  t==='Evidence'    ? '#c7703b' :
  /* Dock */          '#788197';

const MOD   = $('#modal'), FT = $('#FT'), FB = $('#FB'), MType = $('#mType');
const SplitInfo = $('#splitInfo'), SplitTip = $('#splitTip');

/* Load / Save */
function loadGroups(){
  try { GROUPS = JSON.parse(localStorage.getItem(groupKey) || '{}'); }
  catch { GROUPS = {}; }
}

function saveGroups(){
  localStorage.setItem(groupKey, JSON.stringify(GROUPS));
}

function load(){
  try{
    const raw = localStorage.getItem(storageKey);
    SNIPS = raw ? JSON.parse(raw) : seed();
  }catch{ SNIPS = seed(); }
}
function save(){
  localStorage.setItem(storageKey, JSON.stringify(SNIPS));
  $('#autosaveBadge').textContent = 'saved • autosave active';
  setTimeout(()=>$('#autosaveBadge').textContent='ready • autosave active',800);
}
function seed(){
  return [
    {id:id(), type:'Observation', title:'LaTeX test', body:String.raw`# Document X

\\[
\zeta\left(2\right)=\frac{\pi^2}{6}
\\]
`},
    {id:id(), type:'Observation', title:'Ladder up the wall', body:'We see a family of ratios that look like roots of fractions.'},
    {id:id(), type:'Hypothesis', title:'√n/(n+1) relationship', body:String.raw`It appears that

\\[ r_q=\forall n\,\sqrt{\frac{n}{n+1}} \to \{ \sqrt{\tfrac{1}{2}}, \sqrt{\tfrac{2}{3}}, \sqrt{\tfrac{3}{4}}, \dots \} \tag{05:01} \\]`},
    {id:id(), type:'Evidence', title:'Figure crop + table', body:String.raw`<table style="width:100%; table-layout:fixed; border-collapse:collapse;">
  <colgroup><col style="width:120px;"><col></colgroup>
  <tbody><tr>
    <td style="padding:0; vertical-align:top;">
      <div style="--x:.4; --y:0; width:100%; aspect-ratio:1/1; position:relative; overflow:hidden; border-radius:4px;">
        <img src="https://virgorises.github.io/cafes/zeta-zero-cafe/notebook/figures/Figure_5.3_Triangular_numbers_-_chord_density.PNG"
             alt="" style="position:absolute; display:block; width:280%; height:280%;
             left:calc(-1 * var(--x) * 10%); top:calc(-1 * var(--y) * 10%);" />
      </div>
    </td>
    <td style="padding:8px 9px; vertical-align:top;">
      <table style="width:100%; border-collapse:collapse; margin:0;">
        <thead><tr>
          <th style="text-align:left; border:1px solid #273341; padding:6px 8px;">n</th>
          <th style="text-align:left; border:1px solid #273341; padding:6px 8px;">math</th>
        </tr></thead>
        <tbody><tr>
          <td style="border:1px solid #273341; padding:6px 8px;">1</td>
          <td style="border:1px solid #273341; padding:6px 8px;">
            \\[ r_q=\forall n\,\sqrt{\frac{n}{n+1}} \to \{ \sqrt{\tfrac{1}{2}}, \sqrt{\tfrac{2}{3}}, \sqrt{\tfrac{3}{4}}, \dots \} \tag{05:01} \\]
          </td>
        </tr></tbody>
      </table>
    </td>
  </tr></tbody>
</table>`}
  ];
}

/* =========================
   Rendering
   ========================= */
function renderList(){
  const list = $('#list'); list.innerHTML = '';

  // Pass 1: compute group membership by scanning Dock headers
  let currentDockId = null;
  const membership = SNIPS.map((sn, idx) => {
    if (sn.type === 'Dock') { currentDockId = sn.id; }
    return { idx, id: sn.id, type: sn.type, dockId: currentDockId };
  });

  // Pass 2: render
  SNIPS.forEach((sn, idx) => {
    const isActive = sn.id === ACTIVE_ID;
    const isDock   = sn.type === 'Dock';
    const dockId   = membership[idx].dockId;
    const dockCollapsed = dockId && GROUPS[dockId]?.collapsed;

    const div = document.createElement('div');
    div.className = 'snip' + (isActive ? ' active' : ' collapsed') + (isDock ? ' dock' : '');
    div.dataset.id = sn.id;
    div.dataset.idx = idx;
    /* NEW: allow drag */
    div.draggable = true;                       // <-- critical
    div.addEventListener('dragstart', e => {    // optional: Firefox-friendly
      e.dataTransfer.setData('text/plain', sn.id);
    })
    
    // If this is a non-dock and its group is collapsed, hide in list
    if (!isDock && dockCollapsed) div.classList.add('group-member', 'hidden');

    div.innerHTML = `
      <div class="bar" style="border-left:6px solid ${typeColor(sn.type)}">
        <div class="left">
          <span class="type badge">${sn.type}</span>
          <span class="title">${escapeHtml(sn.title||'')}</span>
        </div>
        <div class="tools">
          ${isDock ? `
            <button class="btn dock-toggle" data-act="dock-toggle">${GROUPS[sn.id]?.collapsed ? 'Expand' : 'Collapse'}</button>
          ` : `
            <button class="btn" data-act="merge-prev">◀ Merge</button>
            <button class="btn" data-act="merge-next">Merge ▶</button>
            <button class="btn" data-act="edit" title="Edit">✏️</button>
            <button class="btn" data-act="dup" title="Duplicate">📄</button>
            <button class="btn danger" data-act="del" title="Delete">🗑️</button>
          `}
        </div>
      </div>
      <div class="body"></div>
    `;

    // For cards (except Dock), show rendered preview in the card body
    if (!isDock) {
      const bodyEl = div.querySelector('.body');
      bodyEl.innerHTML = marked.parse(normalizeTeX(sn.body || ''));
      // typeset just this card to keep it snappy
      typeset(bodyEl);
    } else {
      // mark dock collapsed state on the element (for CSS text hint)
      if (GROUPS[sn.id]?.collapsed) div.classList.add('collapsed');
      else div.classList.remove('collapsed');
    }

    // select/open card by clicking outside tools
    div.addEventListener('click', (ev)=>{
      if (ev.target.closest('.tools') || ev.target.closest('button')) return;
      ACTIVE_ID = sn.id;
      $$('.snip').forEach(s=>s.classList.add('collapsed'));
      div.classList.remove('collapsed');
      renderList(); renderPreview(); save();
    });

    list.appendChild(div);
  });
}

async function renderPreview(){
  const pv = $('#preview'); pv.innerHTML = '';

  // Compute group membership (same pass as in list)
  let currentDockId = null;
  SNIPS.forEach(sn=>{
    if (sn.type === 'Dock') {
      currentDockId = sn.id;
      // render a dock header in preview
      const dock = document.createElement('section');
      dock.className = 'pv-snip dock';
      dock.dataset.id = sn.id;
      dock.innerHTML = `<div class="pv-body"><h3 style="margin:0">${escapeHtml(sn.title||'')}</h3></div>`;
      pv.appendChild(dock);
      return;
    }
    const sec = document.createElement('section');
    const collapsed = currentDockId && GROUPS[currentDockId]?.collapsed;
    sec.className = 'pv-snip group-member' + (collapsed ? ' hidden' : '') + (sn.id===ACTIVE_ID?' active':'');
    sec.dataset.id = sn.id;
    sec.innerHTML = `<div class="pv-body">${marked.parse(normalizeTeX(sn.body||''))}</div>`;
    pv.appendChild(sec);
  });

  await typeset(pv);
  if (ACTIVE_ID) scrollPreviewTo(ACTIVE_ID);
}

function normalizeTeX(s){
  // leave user escapes as-is; marked handles HTML; MathJax picks \\(...\\) and \\[...\\]
  return s;
}

function scrollPreviewTo(id){
  const el = $(`.pv-snip[data-id="${id}"]`, $('#preview'));
  if (el) el.scrollIntoView({block:'start',behavior:'smooth'});
}

function escapeHtml(s){
  return s.replace(/[&<>"]/g, m=>({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[m]));
}

/* =========================
   Events (list)
   ========================= */
$('#list').addEventListener('click', (ev)=>{
  const btn  = ev.target.closest('button'); 
  const card = ev.target.closest('.snip'); 
  if(!card) return;

  const idx  = SNIPS.findIndex(s=>s.id===card.dataset.id); 
  if(idx<0) return;

  if (!btn) { /* handled above for select */ return; }

  const act = btn.dataset.act;
  const sn  = SNIPS[idx];

  if (act === 'dock-toggle' && sn.type === 'Dock') {
    const s = GROUPS[sn.id] ||= { collapsed:false };
    s.collapsed = !s.collapsed;
    saveGroups();
    renderList(); renderPreview();
    return;
  }
});

let dragIndex = -1;
$('#list').addEventListener('dragstart', e=>{
  const card = e.target.closest('.snip'); if(!card) return;
  dragIndex = SNIPS.findIndex(s=>s.id===card.dataset.id);
  card.classList.add('drag-hint');
  e.dataTransfer.effectAllowed='move';
});
$('#list').addEventListener('dragend', ()=>$$('.snip').forEach(s=>s.classList.remove('drag-hint')));
$('#list').addEventListener('dragover', e=>{
  e.preventDefault();
  const tgt = e.target.closest('.snip'); if(!tgt) return;
  const over = SNIPS.findIndex(s=>s.id===tgt.dataset.id);
  if (dragIndex<0 || over<0 || over===dragIndex) return;
  const [it] = SNIPS.splice(dragIndex,1);
  SNIPS.splice(over,0,it);
  dragIndex = over;
  save(); renderList(); renderPreview(); // keep preview in sync after reorder
});

/* =========================
   Modal
   ========================= */
$('#btnClose').onclick = $('#btnCancel').onclick = closeModal;
$('#btnSave').onclick  = saveModal;
$('#btnSplit').onclick = splitAtMarker;

$('#modal-toolbar').addEventListener('click', e=>{
  const b = e.target.closest('button'); if(!b) return;
  insertAtCaret(FB, buildInsert(b.dataset.insert));
  updateSplitState();
});

function openModal(sn){
  ACTIVE_ID = sn.id;
  EDITING = sn;
  MType.textContent = '— ' + sn.type.toLowerCase();
  FT.value = sn.title || '';
  FB.value = sn.body  || '';
  updateSplitState();
  if (MOD.hasAttribute('open')) MOD.close();
  MOD.showModal();
  setTimeout(()=>FB.focus(),0);
}
function closeModal(){ EDITING=null; MOD.close(); }
function updateSplitState(){
  const n = (FB.value.match(/\[split\]/g)||[]).length;
  SplitInfo.textContent = `[split] markers: ${n}`;
  SplitTip.textContent = n ? '' : 'Tip: insert [split] where you want to cut.';
}
function splitAtMarker(){
  if(!EDITING) return;
  if(!/\[split\]/.test(FB.value)){
    SplitTip.textContent = 'Insert [split] where you want to split.';
    SplitInfo.classList.add('split-warn');
    setTimeout(()=>SplitInfo.classList.remove('split-warn'),1200);
    return;
  }
  const parts = FB.value.split(/\[split\]/);
  const i = SNIPS.findIndex(s=>s.id===EDITING.id);
  SNIPS[i].title = FT.value.trim();
  SNIPS[i].body  = parts[0].trim();
  parts.slice(1).forEach(p=>{
    SNIPS.splice(i+1,0,{...SNIPS[i], id:id(), body:p.trim()});
  });
  save(); renderList(); renderPreview(); closeModal();
}
function saveModal(){
  if(!EDITING) return;
  EDITING.title = FT.value.trim();
  EDITING.body  = FB.value.replace(/\[split\]/g,'');
  save(); renderList(); renderPreview(); closeModal();
}

/* =========================
   Toolbar snippets
   ========================= */
function buildInsert(kind){
  if(kind==='header'){
    return `chapter: [notebook/] chapter-5-chords.html  •  para: osf-1  •  primary: 51  •  author-id: (Discord …)\n`;
  }
  if(kind==='discord'){
    return `discord: Rank r of n (rfc)  —  #[dissent]  ++  #[concur]  —  [Active|Dormant|Retracted]\n`;
  }
  if(kind==='logic'){
    return `**Logic construct — syllogism**\nPremise 1: If it's raining, then it's cloudy.\nPremise 2: It's raining.\nConclusion: It's cloudy.\n`;
  }
  if(kind==='inline'){
    return ` \\\\( x^2 \\ge y^2 \\\\) `;
  }
  if(kind==='block'){
    return `\\[ E = mc^2 \\]\n`;
  }
  if(kind==='figure'){
    return String.raw`<table style="width:100%; table-layout:fixed; border-collapse:collapse;">
  <colgroup><col style="width:120px;"><col></colgroup>
  <tbody><tr>
    <td style="padding:0; vertical-align:top;">
      <div style="--x:.4; --y:0; width:100%; aspect-ratio:1/1; position:relative; overflow:hidden; border-radius:4px;">
        <img src="https://virgorises.github.io/cafes/zeta-zero-cafe/notebook/figures/Figure_5.3_Triangular_numbers_-_chord_density.PNG"
             alt="" style="position:absolute; display:block; width:280%; height:280%;
             left:calc(-1 * var(--x) * 10%); top:calc(-1 * var(--y) * 10%);" />
      </div>
    </td>
    <td style="padding:8px 9px; vertical-align:top;">
      <table style="width:100%; border-collapse:collapse; margin:0;">
        <thead><tr>
          <th style="text-align:left; border:1px solid #273341; padding:6px 8px;">n</th>
          <th style="text-align:left; border:1px solid #273341; padding:6px 8px;">math</th>
        </tr></thead>
        <tbody><tr>
          <td style="border:1px solid #273341; padding:6px 8px;">1</td>
          <td style="border:1px solid #273341; padding:6px 8px;">\\[ r_q=\forall n\,\sqrt{\frac{n}{n+1}} \to \{ \sqrt{\tfrac{1}{2}}, \sqrt{\tfrac{2}{3}}, \sqrt{\tfrac{3}{4}}, \dots \} \\]</td>
        </tr></tbody>
      </table>
    </td>
  </tr></tbody>
</table>\n`;
  }
  return '';
}

function insertAtCaret(textarea, text){
  const el=textarea, [s,e]=[el.selectionStart, el.selectionEnd];
  const v=el.value; el.value = v.slice(0,s)+text+v.slice(e);
  const p = s + text.length; el.selectionStart=el.selectionEnd=p; el.focus();
}

/* =========================
   Buttons (add, MM, export)
   ========================= */
$('#btnAddObs').onclick = ()=>add('Observation');
$('#btnAddHyp').onclick = ()=>add('Hypothesis');
$('#btnAddEv').onclick  = ()=>add('Evidence');
$('#btnAddDock').onclick = ()=>add('Dock');
function add(type){
  const sn = {id:id(), type, title:'', body:''};
  SNIPS.push(sn); ACTIVE_ID = sn.id; save(); renderList(); renderPreview();
  openModal(sn);
}

$('#btnInsertMM').onclick = ()=>{
  const token = `[mm|p54=60,129:104,169:"sample label"]`;
  if (MOD.open) { insertAtCaret(FB, token); updateSplitState(); return; }
  // otherwise: append to active card
  const i = SNIPS.findIndex(s=>s.id===ACTIVE_ID);
  if (i>=0){ SNIPS[i].body += (SNIPS[i].body ? '\n' : '') + token; save(); renderList(); renderPreview(); }
};

$('#btnExport').onclick = ()=>{
  const body = SNIPS.map(s=>`<!-- ${s.type}:${s.title||''} -->\n${s.body||''}`).join('\n\n');
  const blob = new Blob([body],{type:'text/plain'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'memo.txt';
  a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),500);
};

$('#btnPop').onclick = ()=>{
  const w = window.open('about:blank','preview','width=1024,height=800');
  if(!w) return;
  w.document.write(`<!doctype html><meta charset="utf-8"><title>Live Preview</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <style>
    :root{color-scheme:dark}
    body{background:#0f141a;color:#deedf7;font:16px/1.6 system-ui, -apple-system, Segoe UI, Roboto, Inter, Arial, sans-serif;margin:0}
    .wrap{max-width:960px;margin:0 auto;padding:18px}
    .pv-snip{border:1px solid #273341;border-radius:10px;margin:12px 0;overflow:hidden}
    .pv-head{display:none}
    .pv-body{padding:12px}
    table{border-collapse:collapse}
    th,td{border:1px solid #273341;padding:6px 8px}
  </style>
  <div class="wrap" id="root"></div>
  <script src="/cafes/zeta-zero-cafe/notebook/math/mathconfig.js"><\/script>
  <script id="MathJax-script" defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"><\/script>
  <script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"><\/script>
  <script>
    const root=document.getElementById('root');
    function render(items){
      root.innerHTML='';
      items.forEach(sn=>{
        const sec=document.createElement('section');
        sec.className='pv-snip';
        sec.innerHTML='<div class="pv-head"></div><div class="pv-body">'+marked.parse(sn.body||'')+'</div>';
        root.appendChild(sec);
      });
      if(window.MathJax&&MathJax.typesetPromise) MathJax.typesetPromise([root]);
    }
    window.addEventListener('message',e=>{
      if(e.data && e.data.kind==='render') render(e.data.items);
    });
  <\/script>`);
  // push current content
  w.postMessage({kind:'render', items:SNIPS}, '*');
};

/* =========================
   MathJax helper
   ========================= */
function typeset(root){
  if (window.MathJax && MathJax.typesetPromise) {
    return MathJax.typesetPromise([root]);
  }
  return Promise.resolve();
}

/* =========================
   Init
   ========================= */
load(); loadGroups(); renderList(); renderPreview();

/* keep dialog closed on load (in case browser persisted state) */
if (MOD.hasAttribute('open')) MOD.close();
</script>
